<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Subtle orange glow behind dumbbell -->
  <ellipse cx="512" cy="512" rx="340" ry="120" fill="#f97316" opacity="0.07" filter="url(#glow)"/>

  <!-- LEFT OUTER PLATE -->
  <rect x="152" y="354" width="104" height="316" rx="22" fill="url(#plateGrad)"/>
  <!-- Left plate highlight -->
  <rect x="152" y="354" width="104" height="24" rx="12" fill="white" opacity="0.15"/>

  <!-- LEFT COLLAR -->
  <rect x="256" y="400" width="58" height="224" rx="14" fill="#f97316"/>

  <!-- BAR -->
  <rect x="314" y="468" width="396" height="88" rx="44" fill="url(#barGrad)"/>
  <!-- Bar highlight -->
  <rect x="334" y="473" width="356" height="22" rx="11" fill="white" opacity="0.35"/>

  <!-- RIGHT COLLAR -->
  <rect x="710" y="400" width="58" height="224" rx="14" fill="#f97316"/>

  <!-- RIGHT OUTER PLATE -->
  <rect x="768" y="354" width="104" height="316" rx="22" fill="url(#plateGrad)"/>
  <!-- Right plate highlight -->
  <rect x="768" y="354" width="104" height="24" rx="12" fill="white" opacity="0.15"/>

  <!-- Orange accent dot / brand mark below bar -->
  <circle cx="512" cy="650" r="18" fill="#f97316" opacity="0.9"/>
  <circle cx="472" cy="658" r="10" fill="#f97316" opacity="0.5"/>
  <circle cx="552" cy="658" r="10" fill="#f97316" opacity="0.5"/>
</svg>
